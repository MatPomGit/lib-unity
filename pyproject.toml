[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-unity"
version = "0.1.0"
description = "Odczyt statusu Unity Editor i narzędzi przez oficjalne Unity CLI."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mateusz Pomianek"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
